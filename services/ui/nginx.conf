server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: route everything to index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        return 200 "ok\n";
        add_header content-type text/plain;
    }
}
